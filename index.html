<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIENDO Restaurant</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo', sans-serif;
}

body{
    background:#0d0d0d;
    color:white;
}

/* NAVBAR */
nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 20px;
    background:rgba(0,0,0,0.8);
    position:fixed;
    width:100%;
    top:0;
    z-index:1000;
    flex-wrap:wrap;
}

nav .logo{
    font-size:22px;
    color:#d4a43a;
    font-weight:bold;
}

nav ul{
    display:flex;
    list-style:none;
    gap:25px;
}

nav ul li a{
    color:white;
    text-decoration:none;
}

.btn{
    background:#d4a43a;
    padding:8px 15px;
    border-radius:6px;
    color:black;
    font-weight:bold;
    text-decoration:none;
}

/* HERO */
.hero{
    height:100vh;
    background:url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5') center/cover no-repeat;
    display:flex;
    align-items:center;
    padding:0 20px;
    position:relative;
}

.overlay{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
}

.hero-content{
    position:relative;
    max-width:600px;
}

.hero h1{
    font-size:60px;
    color:#d4a43a;
}

.hero p{
    margin:10px 0;
}

/* BUTTONS HERO */
.hero-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:15px;
}

/* SECTION */
.section{
    padding:60px 20px;
    text-align:center;
}

.section h2{
    font-size:30px;
    margin-bottom:40px;
    color:#d4a43a;
}

/* MENU */
.menu{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:#1a1a1a;
    border-radius:10px;
    overflow:hidden;
    padding-bottom:10px;
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.card h3{
    padding:10px;
    color:#d4a43a;
}

.card p{
    padding:0 10px 15px;
    color:#ccc;
}

.price{
    color:#d4a43a;
    font-weight:bold;
    padding-bottom:10px;
}

/* 💬 COMMENTS */
.comment-box{
    padding:10px;
}

.comment-box input{
    width:70%;
    padding:8px;
    border:none;
    border-radius:6px;
}

.comment-box button{
    padding:8px 10px;
    border:none;
    border-radius:6px;
    background:#d4a43a;
    cursor:pointer;
    margin-right:5px;
}

.comments{
    margin-top:10px;
    color:#bbb;
    font-size:14px;
}

/* FEATURES */
.features{
    display:flex;
    justify-content:space-around;
    flex-wrap:wrap;
    gap:20px;
}

.feature{
    background:#1a1a1a;
    padding:20px;
    border-radius:10px;
    width:220px;
}

/* FOOTER */
footer{
    background:black;
    text-align:center;
    padding:20px;
    margin-top:40px;
    color:#888;
}

/* MOBILE */
@media (max-width:768px){
nav{
    flex-direction:column;
    align-items:center;
    gap:10px;
}
nav ul{
    flex-direction:row;
    justify-content:space-around;
    width:100%;
    flex-wrap:wrap;
}
.hero h1{
    font-size:35px;
}
.menu{
    grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
<div class="logo">VIENDO</div>

<ul>
<li><a href="#menu">القائمة</a></li>
<li><a href="#contact">اتصل بنا</a></li>
</ul>

<a class="btn" href="tel:0791071217">احجز الآن</a>
</nav>

<!-- HERO -->
<div class="hero">
<div class="overlay"></div>

<div class="hero-content">
<h1>VIENDO</h1>
<p>أفضل المشاوي في بسكرة</p>

<!-- BUTTONS FIX -->
<div class="hero-buttons">

<a class="btn" href="tel:0791071217">
📞 اتصال
</a>

<a class="btn" href="https://wa.me/213791071217" target="_blank" style="background:#25D366;color:white;">
💬 واتساب
</a>

</div>

</div>
</div>

<!-- MENU -->
<div class="section" id="menu">
<h2>القائمة</h2>

<div class="menu">

<!-- CARD 1 -->
<div class="card">
<img src="https://images.unsplash.com/photo-1550547660-d9450f859349">
<h3>برغر مشوي</h3>
<p>لحم طري مع صوص خاص</p>
<div class="price">1200 دج</div>

<div class="comment-box">
<input id="c1" placeholder="اكتب تعليق...">
<button onclick="addComment('c1','com1')">إرسال</button>
<div class="comments" id="com1"></div>
</div>

</div>

<!-- CARD 2 -->
<div class="card">
<img src="https://images.unsplash.com/photo-1600891964599-f61ba0e24092">
<h3>مشاوي متنوعة</h3>
<p>أفضل اللحوم المشوية</p>
<div class="price">1500 دج</div>

<div class="comment-box">
<input id="c2" placeholder="اكتب تعليق...">
<button onclick="addComment('c2','com2')">إرسال</button>
<div class="comments" id="com2"></div>
</div>

</div>

<!-- CARD 3 -->
<div class="card">
<img src="https://images.unsplash.com/photo-1540189549336-e6e99c3679fe">
<h3>سلطة فرش</h3>
<p>خضار طازجة وصحية</p>
<div class="price">500 دج</div>

<div class="comment-box">
<input id="c3" placeholder="اكتب تعليق...">
<button onclick="addComment('c3','com3')">إرسال</button>
<div class="comments" id="com3"></div>
</div>

</div>

</div>
</div>

<!-- CONTACT -->
<div class="section" id="contact">
<h2>اتصل بنا</h2>

<div class="features">
<div class="feature">📍 بسكرة</div>
<div class="feature">📞 0791071217</div>
<div class="feature">💬 واتساب مباشر</div>
</div>
</div>

<footer>
© 2026 VIENDO Restaurant
</footer>

<script>
function addComment(inputId, boxId){
let input = document.getElementById(inputId);
let box = document.getElementById(boxId);

if(input.value.trim() === "") return;

let p = document.createElement("p");
p.innerText = "💬 " + input.value;

box.appendChild(p);

input.value = "";
}
</script>

</body>
</html>
