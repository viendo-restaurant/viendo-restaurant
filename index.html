<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIENDO Restaurant</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo', sans-serif;
}

body{
    background:#0d0d0d;
    color:white;
}

/* NAVBAR */
nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 20px;
    background:rgba(0,0,0,0.8);
    position:fixed;
    width:100%;
    top:0;
    z-index:1000;
    flex-wrap:wrap;
}

nav .logo{
    font-size:22px;
    color:#d4a43a;
    font-weight:bold;
}

nav ul{
    display:flex;
    list-style:none;
    gap:25px;
}

nav ul li a{
    color:white;
    text-decoration:none;
}

.btn{
    background:#d4a43a;
    padding:8px 15px;
    border-radius:6px;
    color:black;
    font-weight:bold;
    text-decoration:none;
}

/* HERO */
.hero{
    height:100vh;
    background:url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5') center/cover no-repeat;
    display:flex;
    align-items:center;
    padding:0 20px;
    position:relative;
}

.overlay{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
}

.hero-content{
    position:relative;
}

.hero h1{
    font-size:60px;
    color:#d4a43a;
}

.hero p{
    margin:10px 0;
}

/* SECTION */
.section{
    padding:60px 20px;
    text-align:center;
}

.section h2{
    color:#d4a43a;
    margin-bottom:30px;
}

/* MENU */
.menu{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:#1a1a1a;
    border-radius:10px;
    padding-bottom:15px;
    overflow:hidden;
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.card h3{
    color:#d4a43a;
    margin:10px;
}

.card p{
    color:#ccc;
}

.price{
    color:#d4a43a;
    font-weight:bold;
    margin-bottom:10px;
}

/* BUTTONS */
.btn{
    cursor:pointer;
}

/* COMMENTS */
.card button{
    margin:3px;
    padding:5px 10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.comments{
    margin-top:10px;
    font-size:14px;
    color:#ccc;
}

/* CONTACT */
.features{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.feature{
    background:#1a1a1a;
    padding:20px;
    border-radius:10px;
    width:220px;
}

/* FOOTER */
footer{
    text-align:center;
    padding:20px;
    background:black;
    margin-top:40px;
    color:#888;
}

/* MOBILE */
@media(max-width:768px){
.hero h1{font-size:35px;}
.menu{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<nav>
<div class="logo">VIENDO</div>
<ul>
<li><a href="#menu">القائمة</a></li>
<li><a href="#contact">اتصل بنا</a></li>
</ul>
<a class="btn" href="tel:0791071217">احجز الآن</a>
</nav>

<!-- HERO -->
<div class="hero">
<div class="overlay"></div>
<div class="hero-content">
<h1>VIENDO</h1>
<p>أفضل المشاوي في بسكرة</p>
</div>
</div>

<!-- MENU -->
<div class="section" id="menu">
<h2>القائمة</h2>

<div class="menu">

<!-- CARD 1 -->
<div class="card">
<img src="https://images.unsplash.com/photo-1550547660-d9450f859349">
<h3>برغر مشوي</h3>
<p>لحم طري مع صوص خاص</p>
<div class="price">1200 دج</div>

<button onclick="like(this)">👍 <span>0</span></button>
<button onclick="dislike(this)">👎 <span>0</span></button>

<div>
<input placeholder="اكتب تعليق..." style="padding:6px;border-radius:6px;border:none;width:70%;">
<button onclick="addComment(this)" class="btn">إرسال</button>
<div class="comments"></div>
</div>
</div>

<!-- CARD 2 -->
<div class="card">
<img src="https://images.unsplash.com/photo-1600891964599-f61ba0e24092">
<h3>مشاوي متنوعة</h3>
<p>أفضل اللحوم المشوية</p>
<div class="price">1500 دج</div>

<button onclick="like(this)">👍 <span>0</span></button>
<button onclick="dislike(this)">👎 <span>0</span></button>

<div>
<input placeholder="اكتب تعليق..." style="padding:6px;border-radius:6px;border:none;width:70%;">
<button onclick="addComment(this)" class="btn">إرسال</button>
<div class="comments"></div>
</div>
</div>

</div>
</div>

<!-- CONTACT -->
<div class="section" id="contact">
<h2>اتصل بنا</h2>

<div class="features">
<div class="feature">📍 بسكرة</div>
<div class="feature">
📞 0791071217
</div>
<div class="feature">
💬 واتساب
</div>
</div>
</div>

<footer>
© 2026 VIENDO Restaurant
</footer>

<script>
function like(btn){
let span = btn.querySelector("span");
span.innerText = +span.innerText + 1;
}

function dislike(btn){
let span = btn.querySelector("span");
span.innerText = +span.innerText + 1;
}

function addComment(btn){
let input = btn.previousElementSibling;
let text = input.value;

if(text.trim() === "") return;

let comments = btn.parentElement.querySelector(".comments");

let p = document.createElement("p");
p.innerText = "💬 " + text;

comments.appendChild(p);

input.value = "";
}
</script>

</body>
</html>
